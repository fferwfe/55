<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🔦 密令尋寶</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e1a;
  --panel: #111827;
  --border: #1e3a5f;
  --accent: #00d4ff;
  --accent2: #ff6b35;
  --success: #00ff88;
  --warn: #ffcc00;
  --text: #e2e8f0;
  --muted: #64748b;
  --glow: rgba(0,212,255,0.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 0 40px;
  position: relative;
  overflow-x: hidden;
}

/* starfield bg */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: radial-gradient(1px 1px at 20% 15%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 60% 40%, rgba(255,255,255,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 80% 70%, rgba(255,255,255,0.2) 0%, transparent 100%),
    radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 10% 55%, rgba(255,255,255,0.2) 0%, transparent 100%);
  pointer-events: none;
  z-index: 0;
}

/* scanline */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px);
  pointer-events: none;
  z-index: 1;
}

.wrap { position: relative; z-index: 2; width: 100%; max-width: 480px; padding: 0 16px; }

/* ── TOP BAR ── */
.topbar {
  width: 100%;
  max-width: 480px;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  position: relative;
  z-index: 2;
  margin-bottom: 20px;
}
.topbar-title {
  font-family: 'Orbitron', monospace;
  font-size: 13px;
  color: var(--accent);
  letter-spacing: 0.2em;
}
.team-badge {
  background: var(--border);
  border: 1px solid var(--accent);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  color: var(--accent);
  font-weight: 700;
}

/* ── STAGE INDICATOR ── */
.stage-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 20px;
}
.stage-dot {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
  flex-shrink: 0;
  transition: all 0.4s;
}
.stage-dot.done {
  background: var(--success);
  border-color: var(--success);
  color: #000;
}
.stage-dot.current {
  background: var(--accent);
  border-color: var(--accent);
  color: #000;
  box-shadow: 0 0 12px var(--accent);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { box-shadow: 0 0 8px var(--accent); }
  50% { box-shadow: 0 0 20px var(--accent); }
}
.stage-line {
  flex: 1;
  height: 2px;
  background: var(--border);
  position: relative;
  overflow: hidden;
}
.stage-line.done::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--success);
  animation: fillLine 0.6s ease both;
}
@keyframes fillLine {
  from { width: 0; }
  to   { width: 100%; }
}

/* ── MAIN CARD ── */
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px 20px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
  animation: cardIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes cardIn {
  from { opacity: 0; transform: scale(0.92) translateY(20px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}

.card-eyebrow {
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  letter-spacing: 0.25em;
  color: var(--accent);
  margin-bottom: 8px;
}
.card-stage-num {
  font-family: 'Orbitron', monospace;
  font-size: 48px;
  font-weight: 900;
  color: transparent;
  -webkit-text-stroke: 1px var(--border);
  line-height: 1;
  position: absolute;
  top: 16px; right: 20px;
  opacity: 0.4;
}
.card-title {
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 16px;
  line-height: 1.3;
}

/* clue box */
.clue-box {
  background: rgba(0,212,255,0.05);
  border: 1px solid rgba(0,212,255,0.2);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 16px;
}
.clue-label {
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--accent);
  font-weight: 700;
  margin-bottom: 8px;
}
.clue-text {
  font-size: 15px;
  line-height: 1.8;
  color: var(--text);
}

/* hint box */
.hint-box {
  background: rgba(255,107,53,0.07);
  border: 1px solid rgba(255,107,53,0.25);
  border-radius: 8px;
  padding: 12px 14px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin-bottom: 16px;
}
.hint-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
.hint-content { font-size: 13px; color: #ffa07a; line-height: 1.6; }
.hint-content strong { color: var(--accent2); font-size: 11px; letter-spacing: 0.1em; display: block; margin-bottom: 2px; }

/* ── NFC SCAN AREA ── */
.nfc-zone {
  border: 2px dashed var(--border);
  border-radius: 12px;
  padding: 28px 20px;
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: all 0.3s;
}
.nfc-zone.scanning {
  border-color: var(--accent);
  background: var(--glow);
  animation: scanPulse 1.5s infinite;
}
@keyframes scanPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(0,212,255,0.3); }
  50% { box-shadow: 0 0 0 12px rgba(0,212,255,0); }
}
.nfc-icon { font-size: 40px; margin-bottom: 8px; }
.nfc-main-text {
  font-family: 'Orbitron', monospace;
  font-size: 13px;
  color: var(--accent);
  letter-spacing: 0.15em;
  margin-bottom: 4px;
}
.nfc-sub-text {
  font-size: 12px;
  color: var(--muted);
}

/* scan rings animation */
.scan-rings {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid var(--accent);
  opacity: 0;
  animation: ringExpand 2.4s infinite;
}
.ring:nth-child(1) { width: 60px; height: 60px; animation-delay: 0s; }
.ring:nth-child(2) { width: 100px; height: 100px; animation-delay: 0.6s; }
.ring:nth-child(3) { width: 140px; height: 140px; animation-delay: 1.2s; }
@keyframes ringExpand {
  0%   { opacity: 0.6; transform: scale(0.5); }
  100% { opacity: 0; transform: scale(1.5); }
}

/* ── SUCCESS STATE ── */
.success-card {
  display: none;
  text-align: center;
  padding: 32px 20px;
  animation: cardIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
}
.success-card.show { display: block; }
.success-icon { font-size: 56px; margin-bottom: 12px; }
.success-title {
  font-family: 'Orbitron', monospace;
  font-size: 18px;
  color: var(--success);
  letter-spacing: 0.1em;
  margin-bottom: 6px;
}
.success-msg { font-size: 14px; color: var(--muted); line-height: 1.7; }
.next-btn {
  margin-top: 20px;
  background: var(--success);
  color: #000;
  border: none;
  border-radius: 8px;
  padding: 14px 32px;
  font-family: 'Orbitron', monospace;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.1em;
  cursor: pointer;
  width: 100%;
  transition: all 0.2s;
}
.next-btn:hover { opacity: 0.85; }
.next-btn:active { transform: scale(0.97); }

/* ── FINAL SCREEN ── */
.final-screen {
  display: none;
  text-align: center;
  padding: 40px 20px;
}
.final-screen.show { display: block; animation: cardIn 0.6s ease both; }
.final-trophy { font-size: 72px; margin-bottom: 16px; animation: trophySpin 1s ease both; }
@keyframes trophySpin {
  from { transform: rotate(-20deg) scale(0.5); opacity: 0; }
  to   { transform: rotate(0deg) scale(1); opacity: 1; }
}
.final-title {
  font-family: 'Orbitron', monospace;
  font-size: 20px;
  color: var(--warn);
  letter-spacing: 0.1em;
  margin-bottom: 8px;
}
.final-time {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 20px;
}
.rank-card {
  background: var(--panel);
  border: 1px solid var(--warn);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
}
.rank-label { font-size: 11px; letter-spacing: 0.2em; color: var(--warn); margin-bottom: 4px; }
.rank-team { font-size: 22px; font-weight: 700; color: #fff; }

/* ── LEADERBOARD ── */
.leaderboard {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-top: 16px;
}
.lb-title {
  font-family: 'Orbitron', monospace;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--accent);
  margin-bottom: 12px;
}
.lb-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.lb-row:last-child { border-bottom: none; }
.lb-rank { width: 24px; text-align: center; font-weight: 700; color: var(--muted); font-family: 'Orbitron', monospace; font-size: 11px; }
.lb-rank.gold { color: var(--warn); }
.lb-name { flex: 1; font-weight: 700; }
.lb-stage { color: var(--muted); font-size: 12px; }
.lb-time { color: var(--accent); font-size: 12px; font-family: 'Orbitron', monospace; }

/* ── TEAM SETUP ── */
.setup-screen {
  padding: 40px 0 20px;
  text-align: center;
}
.setup-title {
  font-family: 'Orbitron', monospace;
  font-size: 22px;
  color: var(--accent);
  letter-spacing: 0.1em;
  margin-bottom: 6px;
}
.setup-sub { font-size: 13px; color: var(--muted); margin-bottom: 32px; }
.setup-field {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  font-size: 16px;
  font-family: 'Noto Sans TC', sans-serif;
  color: var(--text);
  width: 100%;
  outline: none;
  margin-bottom: 12px;
  transition: border-color 0.2s;
}
.setup-field:focus { border-color: var(--accent); }
.setup-btn {
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 8px;
  padding: 14px;
  width: 100%;
  font-family: 'Orbitron', monospace;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: opacity 0.2s;
}
.setup-btn:hover { opacity: 0.85; }
.logo-big { font-size: 48px; margin-bottom: 16px; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-title">🔦 密令尋寶</div>
  <div class="team-badge" id="teamBadge">─</div>
</div>

<div class="wrap">

  <!-- ── SETUP SCREEN ── -->
  <div id="setupScreen" class="setup-screen">
    <div class="logo-big">🗺️</div>
    <div class="setup-title">TREASURE HUNT</div>
    <div class="setup-sub">輸入你的隊伍名稱開始任務</div>
    <input class="setup-field" id="teamInput" type="text" placeholder="隊伍名稱（例如：閃電隊）" maxlength="12">
    <button class="setup-btn" onclick="startGame()">開始任務 →</button>
  </div>

  <!-- ── GAME SCREEN ── -->
  <div id="gameScreen" style="display:none">

    <!-- stage dots -->
    <div class="stage-row" id="stageRow"></div>

    <!-- clue card -->
    <div class="card" id="clueCard">
      <div class="card-stage-num" id="cardStageNum">01</div>
      <div class="card-eyebrow">MISSION</div>
      <div class="card-title" id="cardTitle">找到第一個線索</div>

      <div class="clue-box">
        <div class="clue-label">📜 線索</div>
        <div class="clue-text" id="cardClue">─</div>
      </div>

      <div class="hint-box" id="hintBox">
        <div class="hint-icon">🧭</div>
        <div class="hint-content">
          <strong>提示</strong>
          <span id="cardHint">─</span>
        </div>
      </div>

      <!-- NFC zone -->
      <div class="nfc-zone scanning">
        <div class="scan-rings">
          <div class="ring"></div>
          <div class="ring"></div>
          <div class="ring"></div>
        </div>
        <div class="nfc-icon">📡</div>
        <div class="nfc-main-text">等待刷卡</div>
        <div class="nfc-sub-text">找到 NFC 卡片並靠近手機</div>
      </div>
    </div>

    <!-- success state (shown after card scan) -->
    <div class="card success-card" id="successCard">
      <div class="success-icon">✅</div>
      <div class="success-title">卡片已驗證！</div>
      <div class="success-msg" id="successMsg">第一關完成！繼續前進找下一個卡片。</div>
      <button class="next-btn" id="nextBtn" onclick="nextStage()">前往下一關 →</button>
    </div>

    <!-- leaderboard -->
    <div class="leaderboard">
      <div class="lb-title">📊 即時排行</div>
      <div id="lbList"></div>
    </div>
  </div>

  <!-- ── FINAL SCREEN ── -->
  <div id="finalScreen" class="final-screen">
    <div class="final-trophy">🏆</div>
    <div class="final-title">任務完成！</div>
    <div class="final-time" id="finalTime">完成時間：─</div>
    <div class="rank-card">
      <div class="rank-label">你的隊伍</div>
      <div class="rank-team" id="finalTeam">─</div>
    </div>
    <p style="font-size:13px;color:var(--muted);line-height:1.8">
      🎉 恭喜完成所有任務！<br>向營輔老師出示此畫面領取獎勵。
    </p>

    <div class="leaderboard" style="margin-top:20px">
      <div class="lb-title">🏅 最終排名</div>
      <div id="finalLbList"></div>
    </div>
  </div>

</div><!-- /wrap -->

<script>
// ═══════════════════════════════════════
// 關卡資料（從後台 localStorage 讀取）
// ═══════════════════════════════════════
const STAGES_DEFAULT = [
  { id:1, title:"範例第一關", clue:"這是預設範例，請到後台 admin.html 設定你的活動關卡。", hint:"前往 admin.html", cardId:"NFC-001" }
];

// ↓↓↓ 把後台匯出的程式碼貼在這裡（取代下面這行）↓↓↓

const STAGES = [
  {
    "id": 1,
    "title": "1",
    "clue": "手上",
    "hint": "",
    "cardId": "NFC-001"
  },
  {
    "id": 2,
    "title": "2",
    "clue": "手上",
    "hint": "",
    "cardId": "NFC-002"
  }
];



// ═══════════════════════════════════════
// 遊戲狀態
// ═══════════════════════════════════════
let state = {
  team: '',
  currentStage: 0,
  startTime: null,
  stageTimes: [],
  finished: false
};

// 讀取 localStorage
function loadState() {
  const saved = localStorage.getItem('nfc_hunt_state');
  if (saved) state = JSON.parse(saved);
}
function saveState() {
  localStorage.setItem('nfc_hunt_state', JSON.stringify(state));
}

// 模擬排行榜（示範用）
let leaderboard = JSON.parse(localStorage.getItem('nfc_lb') || '[]');

function updateLeaderboard() {
  // 加入/更新自己
  const existing = leaderboard.findIndex(r => r.team === state.team);
  const entry = {
    team: state.team,
    stage: state.currentStage,
    finished: state.finished,
    time: state.finished ? (state.stageTimes[state.stageTimes.length - 1] - state.startTime) : null
  };
  if (existing >= 0) leaderboard[existing] = entry;
  else leaderboard.push(entry);

  // 排序：完成的排前面（依時間），未完成依關卡數
  leaderboard.sort((a, b) => {
    if (a.finished && b.finished) return a.time - b.time;
    if (a.finished) return -1;
    if (b.finished) return 1;
    return b.stage - a.stage;
  });
  localStorage.setItem('nfc_lb', JSON.stringify(leaderboard));
}

function renderLeaderboard(targetId) {
  const el = document.getElementById(targetId);
  if (!leaderboard.length) {
    el.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:12px;padding:8px">尚無其他隊伍</div>';
    return;
  }
  el.innerHTML = leaderboard.slice(0, 8).map((r, i) => {
    const isMe = r.team === state.team;
    const timeStr = r.finished ? formatTime(r.time) : '─';
    return `<div class="lb-row" style="${isMe ? 'color:#fff;background:rgba(0,212,255,0.07);margin:0 -4px;padding:8px 4px;border-radius:6px' : ''}">
      <div class="lb-rank ${i===0?'gold':''}">${i+1}</div>
      <div class="lb-name">${r.team}${isMe?' 👈':''}</div>
      <div class="lb-stage">關${r.stage}/${STAGES.length}</div>
      <div class="lb-time">${timeStr}</div>
    </div>`;
  }).join('');
}

function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

// ═══════════════════════════════════════
// 開始遊戲
// ═══════════════════════════════════════
function startGame() {
  const name = document.getElementById('teamInput').value.trim();
  if (!name) { document.getElementById('teamInput').focus(); return; }

  state.team = name;
  state.currentStage = 1;
  state.startTime = Date.now();
  state.stageTimes = [];
  state.finished = false;
  saveState();

  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';
  document.getElementById('teamBadge').textContent = name;

  renderStage();
  updateLeaderboard();
  renderLeaderboard('lbList');
}

// ═══════════════════════════════════════
// 渲染關卡
// ═══════════════════════════════════════
function renderStage() {
  const s = STAGES[state.currentStage - 1];
  document.getElementById('cardStageNum').textContent = String(state.currentStage).padStart(2,'0');
  document.getElementById('cardTitle').textContent = s.title;
  document.getElementById('cardClue').innerHTML = s.clue;
  document.getElementById('cardHint').textContent = s.hint;

  // stage dots
  const row = document.getElementById('stageRow');
  row.innerHTML = '';
  STAGES.forEach((st, i) => {
    const n = i + 1;
    if (i > 0) {
      const line = document.createElement('div');
      line.className = 'stage-line' + (n <= state.currentStage ? ' done' : '');
      row.appendChild(line);
    }
    const dot = document.createElement('div');
    dot.className = 'stage-dot' +
      (n < state.currentStage ? ' done' : '') +
      (n === state.currentStage ? ' current' : '');
    dot.textContent = n < state.currentStage ? '✓' : n;
    row.appendChild(dot);
  });

  document.getElementById('clueCard').style.display = '';
  document.getElementById('successCard').classList.remove('show');

  // animate card in
  const card = document.getElementById('clueCard');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = '';
}

// ═══════════════════════════════════════
// NFC 卡片掃描觸發（URL 參數 ?card=NFC-001）
// ═══════════════════════════════════════
function checkNFCParam() {
  const params = new URLSearchParams(window.location.search);
  const cardId = params.get('card');
  const teamParam = params.get('team');

  // 如果 URL 帶了 team 參數（NFC 卡也可以直接帶隊伍）
  if (teamParam && !state.team) {
    state.team = teamParam;
    state.currentStage = 1;
    state.startTime = Date.now();
    state.stageTimes = [];
    state.finished = false;
    saveState();
    document.getElementById('setupScreen').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'block';
    document.getElementById('teamBadge').textContent = teamParam;
    renderStage();
  }

  if (!cardId || !state.team || state.finished) return;

  const expected = STAGES[state.currentStage - 1]?.cardId;
  if (cardId === expected) {
    triggerSuccess();
  } else {
    // 錯誤卡片
    showWrongCard(cardId);
  }

  // 清掉 URL 參數（不影響重新整理）
  const clean = window.location.pathname;
  window.history.replaceState({}, '', clean);
}

function triggerSuccess() {
  state.stageTimes.push(Date.now());
  saveState();
  updateLeaderboard();

  document.getElementById('clueCard').style.display = 'none';
  const sc = document.getElementById('successCard');
  sc.classList.add('show');

  const isLast = state.currentStage === STAGES.length;
  document.getElementById('successMsg').textContent = isLast
    ? '🎉 最後一關完成！你們找到寶藏了！'
    : `第 ${state.currentStage} 關完成！繼續前進找下一個 NFC 卡片。`;
  document.getElementById('nextBtn').textContent = isLast ? '查看最終結果 🏆' : '前往下一關 →';

  renderLeaderboard('lbList');
}

function showWrongCard(id) {
  alert(`⚠️ 這不是這一關的卡片！\n（掃到：${id}）\n請繼續尋找正確的 NFC 卡。`);
}

function nextStage() {
  if (state.currentStage >= STAGES.length) {
    showFinal();
    return;
  }
  state.currentStage++;
  saveState();
  document.getElementById('gameScreen').style.display = 'block';
  document.getElementById('successCard').classList.remove('show');
  renderStage();
  renderLeaderboard('lbList');
}

function showFinal() {
  state.finished = true;
  saveState();
  updateLeaderboard();

  document.getElementById('gameScreen').style.display = 'none';
  const fs = document.getElementById('finalScreen');
  fs.classList.add('show');

  const totalMs = Date.now() - state.startTime;
  document.getElementById('finalTime').textContent = `完成時間：${formatTime(totalMs)}`;
  document.getElementById('finalTeam').textContent = state.team;
  renderLeaderboard('finalLbList');
}

// ═══════════════════════════════════════
// 示範按鈕（測試用，正式活動可移除）
// ═══════════════════════════════════════
function simulateScan() {
  if (!state.team || state.finished) return;
  const cardId = STAGES[state.currentStage - 1].cardId;
  const url = window.location.pathname + '?card=' + cardId;
  window.history.replaceState({}, '', url);
  checkNFCParam();
}

// ═══════════════════════════════════════
// 初始化
// ═══════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  loadState();

  const params = new URLSearchParams(window.location.search);
  const hasCard = params.get('card');
  const hasTeam = params.get('team');

  if (state.team && !hasTeam) {
    // 已有存檔，繼續遊戲
    document.getElementById('setupScreen').style.display = 'none';
    document.getElementById('teamBadge').textContent = state.team;

    if (state.finished) {
      showFinal();
    } else {
      document.getElementById('gameScreen').style.display = 'block';
      renderStage();
      renderLeaderboard('lbList');
    }
  }

  checkNFCParam();

  document.getElementById('teamInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') startGame();
  });
});
</script>

<!-- 示範掃卡按鈕（正式活動刪掉這段） -->
<div style="position:fixed;bottom:20px;right:16px;z-index:99" id="demoBtn">
  <button onclick="simulateScan()" style="
    background:rgba(255,107,53,0.9);
    color:#fff;border:none;border-radius:50px;
    padding:10px 18px;font-size:12px;font-weight:700;
    cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.4);
    font-family:'Noto Sans TC',sans-serif;
  ">🔖 模擬刷卡</button>
</div>
</body>
