<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>骰子城市（單機多人）</title>
<style>
body{font-family:sans-serif;background:#f5f5f5;padding:12px;}
.card{background:#fff;padding:12px;border-radius:10px;margin-bottom:10px;}
button{padding:10px;border:none;border-radius:8px;background:#1D9E75;color:#fff;width:100%;margin-top:6px;}
.dice{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.d{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;}
.red{background:#ffd6d6;}
.blue{background:#d6e6ff;}
</style>
</head>
<body>

<h3>🎲 骰子城市（單機多人）</h3>

<div class="card">
目前玩家：<b id="current"></b>
<button onclick="nextPlayer()">👉 下一位玩家</button>
</div>

<div class="card">
🪵 <span id="wood"></span>
🪨 <span id="stone"></span>
🌽 <span id="food"></span><br>
⭐ <span id="score"></span>
</div>

<div class="card">
<button onclick="roll()">🎲 擲骰（12顆）</button>
<div id="dice" class="dice"></div>
<div id="log"></div>
</div>

<div class="card">
🏗 建築：
<div id="buildings"></div>
</div>

<div class="card">
🛒 商店
<button onclick="buy('wood')">🌲 伐木場</button>
<button onclick="buy('stone')">⛏ 採石場</button>
<button onclick="buy('food')">🌾 農場</button>
<button onclick="buy('score')">🏪 市集</button>
<button onclick="buy('castle')">🏯 城堡</button>
</div>

<div class="card">
🏆 排行
<div id="rank"></div>
</div>

<script>

let players = JSON.parse(localStorage.getItem("game")) || [
{name:"玩家一",wood:0,stone:0,food:0,score:0,b:[]},
{name:"玩家二",wood:0,stone:0,food:0,score:0,b:[]},
{name:"玩家三",wood:0,stone:0,food:0,score:0,b:[]}
];

let turn = 0;

function save(){
localStorage.setItem("game", JSON.stringify(players));
}

function render(){
let p = players[turn];

current.innerText = p.name;
wood.innerText = p.wood;
stone.innerText = p.stone;
food.innerText = p.food;
score.innerText = p.score;
buildings.innerHTML = p.b.join("<br>") || "無";

let sorted=[...players].sort((a,b)=>b.score-a.score);
rank.innerHTML = sorted.map((p,i)=>`${i+1}. ${p.name} (${p.score})`).join("<br>");

save();
}

function nextPlayer(){
turn = (turn+1) % players.length;
render();
}

function buy(t){
players[turn].b.push(t);
render();
}

function roll(){
let p = players[turn];

let sum=0,even=0,odd=0,ones=0,blue=0,red1=0;
dice.innerHTML="";
let logTxt="";

for(let i=0;i<12;i++){
let v=Math.floor(Math.random()*6)+1;
let c=Math.random()>0.5?'red':'blue';

sum+=v;
if(v%2===0)even++; else odd++;
if(v===1)ones++;
if(c==='blue')blue++;
if(c==='red' && v===1)red1++;

let d=document.createElement("div");
d.className="d "+c;
d.innerText=v;
dice.appendChild(d);
}

// 基本
if(sum%2===0){p.score+=10;logTxt+="偶數+10<br>";}
else{p.score-=5;logTxt+="奇數-5<br>";}

// 條件
if(ones>=2){p.wood+=3;logTxt+="兩個1→木+3<br>";}
if(even>=3){p.stone+=3;logTxt+="偶數多→石+3<br>";}
if(odd>=3){p.food+=3;logTxt+="奇數多→食+3<br>";}
if(blue>=2){p.score+=15;logTxt+="藍色+15<br>";}

// 偷分
if(red1>=2){
let target = players.filter(x=>x!==p).sort((a,b)=>b.score-a.score)[0];
if(target){
target.score-=10;
p.score+=10;
logTxt+="偷第一名10分<br>";
}
}

// 極端
if(even===12){p.score+=50;logTxt+="全偶數+50<br>";}
if(odd===12){p.score+=50;logTxt+="全奇數+50<br>";}

// 建築加成
p.b.forEach(x=>{
if(x==='wood' && even>=3)p.wood+=2;
if(x==='stone' && ones>=2)p.stone+=2;
if(x==='food' && odd>=3)p.food+=2;
if(x==='score' && blue>=2)p.score+=10;
if(x==='castle' && (even===12||odd===12))p.score+=30;
});

log.innerHTML=logTxt;

render();
}

render();

</script>

</body>
</html>
